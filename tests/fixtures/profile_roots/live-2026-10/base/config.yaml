# Sanitized live-shape copy of profile 'base' (scripts/sanitize_profile_config.py).
model:
  default: gpt-5.6-luna
  provider: openai-codex
  base_url: <redacted:url>
  api_mode: chat_completions
fallback_providers: []
_config_version: 50
image_gen:
  provider: openai-codex
  use_gateway: true
  model: gpt-image-2-medium
mcp_servers:
  launcher_qa:
    platforms:
      - windows
    command: <redacted:path>
    args: []
    env:
      STAGEC_QA_REPO_ROOT: <redacted:text>
      STAGEC_QA_TRANSPORT: direct_control
      STAGEC_SCREENSHOT_HELPER: <redacted:path>
      STAGEC_LAUNCH_HELPER: <redacted:path>
    sampling:
      enabled: false
    timeout: 260
    connect_timeout: 60
agent_runtime:
  redaction_mode: observe
  read_model:
    enabled: true
    delta_patches: true
  enterprise_worker_sessions:
    enabled: true
    mode: enforce
    worker_session_store: true
    persona_instance_runtime: true
    persona_assignment_store: true
    same_session_continuation: true
    harness_owned_proof_recipes: true
    no_edit_certification_sandbox: true
    possession_controls: true
    static_prompt_strategy: capability_detect
    worker_heartbeat_seconds: 5
    worker_stale_seconds: 600
    possession_lease_seconds: 900
    max_same_worker_repairs_per_stage: 1
    max_worker_context_compressions_per_goal: 3
  normal_worker_flow:
    enabled: true
    dev_self_tests_in_session: true
    auto_final_gate_after_delivery: true
    hide_request_test_run_until_gate: true
    self_test_evidence_capture: true
    max_self_test_repeats_without_change: 1
    max_auto_final_gate_repairs_per_stage: 1
    expose_worker_actions_in_contract_dump: true
  mission_plan:
    enabled: true
    enforce_routing: true
    enforce_hud: true
    version: 1
  role_envelope:
    enabled: true
    prefer_same_session: true
    checklist_hud_enabled: true
    self_approval_enabled: true
    qa_final_approval_required: true
    max_same_session_continuations: 8
    max_no_progress_repeats: 1
    max_fix_envelopes_per_stage: 2
    max_checklist_items_rendered: 8
    max_foreign_checklist_summaries: 3
    enable_legacy_stage_projection: true
  repo_bundle_routing:
    enabled: true
    strict_repo_ownership: true
    auto_create_from_mission_plan: true
    queue_on_dependency_bundles: true
    expose_in_snapshot: true
  simplified_agent_contract:
    enabled: true
    expose_only_simplified_actions: true
    keep_internal_state_machine: true
    allow_legacy_decision_aliases: true
    terminal_feedback_enabled: true
  personas:
    pm:
      hermes_profile: pm
      skills:
        - eternia-writing-plans
      required_mcp_servers: []
      provider: openai-codex
      model: gpt-5.3-codex-spark
      api_mode: codex_responses
      role: disabled
    dev:
      display_name: <redacted:text>
      autonomy: autonomous
      include_profile_memory: true
      repo_scope: <redacted:text>
      repo_scope_label: EterniaLauncher
      iteration_budget: 12
      max_wall_seconds: 300
      max_api_calls: 12
      max_total_tokens: 600000
      hermes_profile: gpt-launcher
      skills:
        - staged-deep-audit-delivery
        - aaa-feature-delivery
        - test-driven-development
        - systematic-debugging
        - flutter-ui-development
        - eternia-launcher-workflow
        - frontend-backend-contract-handoff
        - launcher-stagec-mcp-screenshot
        - harness-dev-delivery
        - launcher-analyze-proof
        - harness-handoff-recovery
        - requesting-code-review
        - subagent-driven-development
        - eternia-writing-plans
        - eternia-hermes-agent
        - github-code-review
        - github-pr-workflow
        - codebase-inspection
      required_mcp_servers: []
    backend_dev:
      display_name: <redacted:text>
      role: dev
      autonomy: autonomous
      include_profile_memory: true
      repo_scope: <redacted:text>
      repo_scope_label: EterniaBackend
      iteration_budget: 12
      max_wall_seconds: 300
      max_api_calls: 12
      max_total_tokens: 600000
      hermes_profile: backend-dev
      skills:
        - staged-deep-audit-delivery
        - aaa-feature-delivery
        - test-driven-development
        - systematic-debugging
        - eternia-local-gates
        - eternia-backend-tests
        - frontend-backend-contract-handoff
        - harness-dev-delivery
        - harness-handoff-recovery
        - requesting-code-review
        - subagent-driven-development
        - eternia-writing-plans
        - eternia-hermes-agent
        - github-code-review
        - github-pr-workflow
        - codebase-inspection
      required_mcp_servers: []
    qa:
      hermes_profile: launcher-qa
      include_profile_memory: true
      skills:
        - launcher-stagec-mcp-screenshot
        - systematic-debugging
        - harness-qa-verdict
      required_mcp_servers: []
    neko_supervisor:
      hermes_profile: neko
      chat_lane_restore_toolsets:
        - file
      skills:
        - harness-mission-lead
        - aaa-feature-delivery
        - staged-deep-audit-delivery
        - systematic-debugging
        - eternia-writing-plans
        - eternia-hermes-agent
        - eternia-backend-tests
        - eternia-launcher-workflow
        - frontend-backend-contract-handoff
      required_mcp_servers: []
      display_name: <redacted:text>
      include_profile_memory: true
      soul_overlay_path: <redacted:path>
  default_api_mode: codex_responses
  root_node_mode: false
  swarm:
    enabled: false
    requires_certification: false
    max_active_lanes: 2
remote_gateway:
  listen: 0.0.0.0
  port: 8765
plugins:
  entries:
    eternia-harness:
      settings:
        remote_gateway_listen: 0.0.0.0
        remote_gateway_port: 8765
