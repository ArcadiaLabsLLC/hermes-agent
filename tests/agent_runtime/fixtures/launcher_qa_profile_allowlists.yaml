# Stage C — per-profile launcher_qa tool allowlists (2026-05-17)
#
# Stage 20 deliverable of STAGEC_HERMES_FIRSTCLASS_PLAN_2026-05-17.md.
# Machine-readable convention for which launcher_qa MCP tools each
# Hermes profile may invoke. The MCP server does NOT enforce this
# (Hermes does not natively gate per-tool); workers consume the file
# as an advisory allowlist and log warnings when a denied tool is
# invoked. Native enforcement is a separate Hermes-core initiative.
#
# Schema:
#   profiles:
#     <profile_name>:
#       description: <one-line role>
#       allowed:                  # array of tool/control names or globs
#         - mcp_launcher_qa_*    # glob: every tool
#         - mcp_launcher_qa_get_*  # glob: every read-only get_*
#         - mcp_launcher_qa_set_tab  # literal
#         - shell.nav.*          # semantic controls on the app rail
#         - studio.*             # Eternia Studio semantic controls
#       denied:                   # array — denied wins over allowed
#         - mcp_launcher_qa_kill_launcher
#
# Resolution rule per tool or semantic-control name:
#   1. If any pattern in `denied` matches → DENIED.
#   2. Else if any pattern in `allowed` matches → ALLOWED.
#   3. Else → DENIED (default-deny when profile is in this file).
#   4. Profiles NOT in this file fall back to ALLOWED for every tool
#      (back-compat with profiles configured before this rollout).
#
# Glob semantics: trailing `*` only. No regex, no character classes.
# A literal `*` matches everything.

