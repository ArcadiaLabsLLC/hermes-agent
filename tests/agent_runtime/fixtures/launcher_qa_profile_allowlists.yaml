# Notes:
#
# 1. denied wins over allowed. A glob in allowed cannot resurrect a
#    literal in denied.
#
# 2. The five tools added in Stage 18 (run_redaction_scan,
#    read_artifact_index, get_window_metrics, kill_launcher, read_trace)
#    are:
#      * COVERED BY THE GLOB `mcp_launcher_qa_*` in full-access profiles
#        (launcher-qa-direct, launcher-qa, gpt_launcher,
#        claude_launcher_qa, spark_launcher_qa). No explicit listing
#        needed there.
#      * EXPLICITLY LISTED in restricted profiles (alice, pm, reviewer)
#        so a future tool added under Stage 19+ does not silently fall
#        into the restricted profiles via a missing entry. The drift
#        test in Stage 22 fails CI if a tool in `kStageCQaMcpTools`
#        is unrepresented in a restricted profile.
#
# 3. Profiles NOT listed here fall back to ALLOWED for every tool.
#    This preserves back-compat: dev profiles configured before this
#    rollout keep working unchanged.
#
# 4. Drift test in Stage 22 fails CI if a tool name appears in
#    `kStageCQaMcpTools` but is not represented (allowed-or-denied) in
#    every listed profile. This forces conscious profile review when a
#    new tool lands.
#
# 5. Stage 19 (t_c07ef450, 2026-05-17 — granular control / semantic
#    buttons) split:
#      * get_buttons is read-only — added to the allowed set of every
#        restricted profile (alice / pm / reviewer).
#      * click_button mutates app state — added to the denied set of
#        every restricted profile. Full-access profiles continue to
#        get it via the `mcp_launcher_qa_*` glob.
#
# 6. Batched-drill addendum (2026-07-26 — mcp_launcher_qa_run_actions):
#    the batch tool executes an ordered list of other verbs in one
#    call. Because this allowlist resolves per tool NAME, allowing
#    run_actions in a restricted profile would hand that profile every
#    batchable verb it is otherwise denied. It is therefore DENIED in
#    alice / pm / reviewer and reaches full-access profiles through the
#    `mcp_launcher_qa_*` glob. Destructive / confirmation-contract
#    verbs (kill_launcher) and the process-spawning composers are not
#    batchable at all — the server refuses the whole batch.
#
# 7. set_text (2026-08-03, dd34ff11f) landed in `kStageCQaMcpTools`
#    without touching this file, which left the Stage 22 drift guard
#    (`test/profile_tool_surface_test.dart`) RED for twelve days —
#    unnoticed because nothing in CI runs `dart test` inside
#    tool/stagec_qa_mcp_server (`flutter test` does not reach it). It is
#    now DENIED in all three restricted profiles: it mutates the live
#    shell (`serialised: true`, takes the fixture mutex) and is the
#    input half of a two-step agent-chat send. Its non-batchability
#    (`BatchPolicy.sensitiveInput`) is a SEPARATE gate — run_actions
#    refusing a verb says nothing about whether a profile may call it
#    directly.
#
# 8. get_render_profile (2026-08-12, 7e0ea8389) DID update this file —
#    explicitly allowed for reviewer. alice / pm cover it through their
#    `mcp_launcher_qa_get_*` glob, which is why note 4's drift test
#    passes for them without a literal entry. WEAKNESS worth naming:
#    that glob makes "starts with get_" the security predicate for the
#    PM lane, so any future `get_*` tool is auto-allowed there with no
#    conscious review — exactly what the drift test exists to force.
#    Replacing the glob with the eleven literal `get_*` names would
#    close it; that is a deliberate change, not a drive-by.

# 9. dev_login (2026-09-02) — the debug-only sign-in lane. A
#    `stagec-smoke` session was a GUEST, and a guest reaches no
#    auth-gated surface at all (studioEnabledProvider is false without a
#    playerPublicId, so Studio renders Home and says nothing), while the
#    only sign-in verb on the bus arms an external browser against the
#    staging realm. dev_login calls AuthService.devLogin() — the same
#    call the guest sign-in view's "Dev Login" button makes — mints no
#    token and contacts no realm. Full-access profiles reach it through
#    the `mcp_launcher_qa_*` glob; it is DENIED in alice / pm / reviewer
#    because it mutates auth AND navigation. Its batchability
#    (`BatchPolicy.batchable`, movesAuth + movesNavigation) is a
#    SEPARATE gate, exactly as note 7 records for set_text.

# 10. Semantic-control scopes in the full-access profiles (2026-09-22).
#     Resolution rule 3 is default-DENY for a profile listed in this file, and
#     that applies to semantic controls exactly as it does to tool names. The
#     five full-access profiles carried `shell.nav.*` and `studio.*` and
#     nothing else, so every OTHER control the marionette registers — the
#     whole `mission_control.*` cockpit lane, `library.*`, `education.*`,
#     `posts.nav`, `voice.*`, `settings.audio`, `shell.scroll`,
#     `blocking_modal` — resolved to DENIED. Twenty-eight of thirty scopes,
#     denied for a reason nobody had decided rather than one anybody had: that
#     pair was the entire vocabulary when this file was written in 2026-05, and
#     the vocabulary grew without it.
#
#     The fix is per-FAMILY globs rather than thirty literals, because the
#     grammar here only supports a trailing `*` and a family is the unit these
#     profiles are described in ("full QA capability"). It is not a widening of
#     intent: these five already hold `mcp_launcher_qa_*`, which includes
#     `click_button`, `set_text` and `run_actions`, so nothing here grants a
#     VERB they did not have — it stops the control-name half of the same
#     decision from silently contradicting the tool half.
#
#     The restricted profiles (alice / pm / reviewer) are deliberately
#     UNCHANGED. They deny `click_button`, `set_text` and `run_actions`
#     outright, so no control name is reachable from them and adding scopes
#     would be decoration.
#
#     Keep this list against `StageCQaScopes` in
#     `lib/core/qa/stagec_qa_scopes.dart`, which is the vocabulary both the
#     marionette hooks and the command bus now name. A new FAMILY needs a line
#     here; a new scope inside an existing family does not.
#
# 11. The QA build job (2026-10-03, owner ruling: a QA rebuild is a
#     background job). Two tools joined the catalog. `build_status` reads a
#     job and may wait on it; it starts nothing, so it is ALLOWED in alice /
#     pm / reviewer — a verifier whose launch answered
#     `launch_qa_build_rebuilding` needs it to know when to look again.
#     `prebuild` starts a 5-6 min build under the machine-wide heavy-run
#     slot; it is the orchestrator's post-landing step, so it is DENIED in
#     the restricted profiles and reached by the full-access ones through
#     their `mcp_launcher_qa_*` glob.
