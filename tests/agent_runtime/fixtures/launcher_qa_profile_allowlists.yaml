      # set_tab — it drives the live shell — and PM driver verifies,
      # doesn't drive. Denied.
      - mcp_launcher_qa_set_text
      # Window-scale lane (2026-09-02). resize_window moves the OS
      # window and set_dpi moves the app's display scale — both change
      # the geometry every OTHER profile's screenshots are taken at,
      # from a profile whose whole job is to photograph a final state
      # it did not establish. A PM who resizes the window has changed
      # the evidence, not verified it. Denied.
      - mcp_launcher_qa_resize_window
      - mcp_launcher_qa_set_dpi
      # Pointer lane (2026-09-28). pointer_drag dispatches a real gesture
      # on the Edit World canvas — it places and moves level geometry.
      # A mutator like click_button. Denied.
      - mcp_launcher_qa_pointer_drag

