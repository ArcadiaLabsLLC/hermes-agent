      - mcp_launcher_qa_dev_login
      # Mission Control chat input (2026-08-03, dd34ff11f — landed
      # WITHOUT this entry; see note 7). set_text writes freeform
      # operator text into a declared semantic text target, takes the
      # fixture mutex (`serialised: true`), and is the input half of a
      # two-step send: set_text then click_button
