    - tools.terminal_tool
    - tools.terminal_tool_backends
    - tools.terminal_tool_lifecycle
    - tools.process_registry
    - tools.close_terminal_tool     # desktop_ui toolset: closes a background process's tab
    - tools.browser_tool_lifecycle  # the loop's cleanup_browser: a placeholder stands in
    - tools.delegate_tool           # imports the terminal tool; a placeholder answers the loop's cap
    - tools.code_execution_tool
    - tools.file_tools
    - tools.browser_tool
    - tools.browser_camofox
    - tools.browser_camofox_state
    - tools.browser_lightpanda
    - tools.browser_supervisor
    - tools.browser_supervisor_dialogs
    - tools.browser_supervisor_frames
    - tools.browser_tool_cdp
    - tools.browser_tool_cloud
