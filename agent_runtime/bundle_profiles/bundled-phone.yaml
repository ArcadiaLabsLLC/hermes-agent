# Bundled phone profile — the real Hermes wheel, embedded in the Eternia app on iOS and Android.
#
# Source: the "Bundled phone" column of the launcher's profile matrix
# (`EterniaLauncher/docs/embedded_hermes/planned/PROFILE_MATRIX_2026-09-28.md`) and architecture
# §4/§6 (`EterniaLauncher/docs/embedded_hermes/planned/ARCHITECTURE_2026-09-28.md`).
# Standing rules: enable, never reimplement; bundle only what is needed; one Python
# implementation — no vendored copies.
#
# On phones a feature is ABSENT, not switched off: its modules are not packaged, and the profile
# gate (scripts/bundle_profile_gate.py) refuses the build when the import closure of what IS
# packaged still reaches a provider SDK, a compiled (Rust/C) distribution, pty, psutil, a browser
# tool or a subprocess call. Every switch below is an EXISTING Hermes switch, exactly as for the
# desktop profile (see bundled-desktop.yaml's header for the mapping).
schema_version: 1
profile: bundled-phone

# Credentials and chat history are not a config switch: the embedded entry
# (hermes_cli/harness_parts/serve/in_memory.py, EmbeddedServe.start) refuses to serve until
# the host has bound its secure store for credentials and has protected the history folder
# (agent_runtime/host_store/binding.py: protect_history_dir; owner ruling 2026-09-30).

toolsets:
  disabled:
    # Shell family — not packaged (matrix: "—").
    - terminal          # terminal + process_manage: no shell, no background processes
    - code_execution    # execute_code
    - file              # read_file/write_file/patch/search_files run through the terminal backend
    - browser
    - browser-cdp
    - browser-use
    - computer_use
    # Cron: no background ticker on phones.
    - cronjob
    # Desktop app panes: a phone is not the desktop app.
    - desktop_ui
    # Messaging platform tools — not packaged.
    - discord
    - discord_admin
    - yuanbao
    - feishu_doc
    - feishu_drive
    # Upstream's kanban board and goal gates (git-backed workspaces; not the fork's Mission Board).
    - kanban

config:
  delegation.worktree_isolation: false
  terminal.backend: local
  wake_word.enabled: false
  updates.check: false
  security.allow_lazy_installs: false
  # Local LLM engine supervision: phones use the OS model (host provider, Stage 4).
  local_runtime.enabled: false
  mcp.stdio_servers: false
  # The MCP client runtime (discovery, sessions, transports, OAuth, the server loop): a phone
  # connects to no MCP server. The per-turn tool snapshot (tools.mcp_tool_agent) stays on.
  mcp.client: false
  tts.piper.download_voices: false
  # The Launcher is the one model downloader: the dashboard's model download routes refuse and the
  # serve loop sets HF_HUB_OFFLINE (agent_runtime/bundle_profiles/model_downloads.py).
  local_models.downloads: false
  terminal.external_backends: false
  gateway.platform_adapters: false
  updates.checkout_bound: false
  voice.mode_enabled: false
  auth.adopt_external_logins: false
  providers.qwen-oauth.enabled: false
  telemetry.shared_metrics.enabled: false
  # Stage 2 steps 6-8: no provider SDK (raw-HTTP client, agent/transports/httpx_client.py), no
  # conversation worker subprocess (the in-process worker behind NativePeer), no `hermes auth
  # login` child (the in-process sign-in runner).
  agent.provider_sdks: false
  conversations.subprocess_worker: false
  auth.subprocess_signin: false
  # The in-process gateway reads its wire contracts from the catalog generated from the pydantic
  # models (tui_gateway/contract_seam.py), never from pydantic itself.
  tui_gateway.pydantic_contracts: false
  # Upstream's connectors switch: the gateway/portal connectors (and their pydantic wire models)
  # are not packaged, so the connectors tool is out of the schema and its RPCs answer "unavailable".
  tools.connectors.enabled: false
  # The system prompt's environment probe spawns python/pip/git (tools/env_probe.py); a phone
  # starts no process and has none of them.
  agent.environment_probe: false
  # The native gateway's session branch / repo-root probe (tui_gateway/git_probe.py) spawns git.
  sessions.git_probe: false
  # agent.log records each turn's opening words at INFO (agent/turn_context.py); a phone keeps no
  # plaintext chat on disk, so its file log starts at WARNING.
  logging.level: WARNING

environment:
  HF_HUB_OFFLINE: "1"

refused_routes:
  feature: model_downloads
  paths:
    - /api/local-models/catalog
    - /api/local-models/download
    - /api/local-models/download/pause
    - /api/local-models/download/resume
    - /api/local-models/quickstart
    - /api/local-models/search
    - /api/local-models/search/files
    - /api/local-models/download-browsed

unswitched:
  - area: Realm sync
    gap: realm_sync still shells out to git; the dulwich/HTTP backend behind the realm_sync seam is not built

packaging:
  # CPython 3.14's mobile platforms; markers are evaluated for each.
  targets:
    - android_arm64
    - ios_arm64
  roots:
    - hermes_cli.harness_parts.serve.in_memory   # the embedded entry: the serve loop over the in-memory pipe
    - agent_runtime.serve_rpc                     # the runtime.* method lane
    - run_agent                                   # the core agent loop (upstream's own)
    - model_tools
  # No optional extras: phones call providers over raw HTTP (architecture §6), never an SDK.
  extras: []
  # Compiled distributions the gate admits (architecture §6: small, ships for both platforms,
  # no pure alternative). CPython's own ssl / sqlite3 are the interpreter, not distributions.
  admitted_native:
    pillow: "image sheets and image prep; the one compiled library architecture §6 admits"
  # Base dependencies the phone omits. Refused by the closure script unless every import site
  # in the kept modules is guarded (try/suppress ImportError).
  omitted_distributions:
    - distribution: pydantic
      imports: [pydantic]
      degrades: the in-process gateway validates its wire against the generated contract catalog (tui_gateway/contract_seam.py, tui_gateway.pydantic_contracts false); the connectors RPCs and MCP OAuth are not packaged
    - distribution: pydantic-core
      imports: [pydantic_core]
      degrades: nothing beyond pydantic's row — only pydantic imports it
    - distribution: openai
      imports: [openai]
      # The embedded entry registers this module's `openai` (the SDK-free classes under the SDK's
      # names), so upstream's unguarded import sites resolve; the closure proves each at run time.
      stand_in: agent_runtime.provider_sdk_shim
      degrades: nothing on the provider wires — agent.provider_sdks false builds the SDK-free clients (agent/transports/httpx_client.py, httpx_responses.py, httpx_anthropic.py); OpenAI cloud STT (openai package check) and OpenAI streaming TTS are unavailable (the shim's client has no audio surface); mem0 OSS uses the SDK-free client
    - distribution: cryptography
      imports: [cryptography]
      # PyJWT ships without its requested `crypto` extra (pyproject: pyjwt[crypto]); its algorithms
      # module imports cryptography guarded, so HS256 and the phone's unverified claim reads remain
      # (tools/skills_sync_client.py). The closure proves `jwt` imports with cryptography absent.
      dropped_extras: ["pyjwt[crypto]"]
      degrades: RS/ES/EdDSA JSON Web Token verification (dashboard sign-in, desktop only); the local secrets vault (agent.vault_store, owner D3 2026-09-30) and the external password managers (agent.vault_backends) are not packaged — the host's secure store binding is the phone's vault and the vault.* RPCs answer unavailable; the gateway's self-signed TLS mint (agent_runtime/gateway_tls.py) refuses, as a phone serves no remote gateway; every other kept import site is ImportError-guarded
    - distribution: cffi
      imports: [cffi, _cffi_backend]
      degrades: nothing beyond cryptography's row — only cryptography needs it
    - distribution: pillow-heif
      imports: [pillow_heif]
      degrades: nothing — the phone host transcodes HEIC/AVIF photos to JPEG before handing them to Hermes (owner D2 2026-09-30); agent.image_routing's HEIF opener registration is ImportError-guarded
    - distribution: psutil
      imports: [psutil]
      degrades: nothing a phone has — it starts no sibling process; pid liveness falls back to the stdlib (hermes_cli/_subprocess_compat.py::pid_exists_stdlib), and every kept import site is ImportError-guarded (discussions/native.py, conversations/native_peer.py, process_identity.py and hermes_constants_scratch.py since lane s2-g2)
  # The forced set (switched-off code kept code imports unguarded) ships under `phone_forced/`
  # beside `app/`, never under the scanned `tools/` / `plugins/`: upstream's directory scans
  # (tools/registry.py discover_builtin_tools, the plugin loader) would import it. The embedded
  # entry mounts it on `tools.__path__` / `plugins.__path__` (agent_runtime/bundle_profiles/
  # forced_tree.py; owner ruling 2026-09-30, option (1)).
  forced_sibling_tree: true
  # Skills ship only when their frontmatter `platforms:` names a phone OS — the existing
  # per-skill OS switch (agent/skill_utils.py::skill_matches_platform), so the same marker also
  # hides an unmarked skill from a phone's skill index at run time.
  skill_platforms:
    - android
    - ios
  resources:
    - skills
    - locales
  plugins:
    - model-providers
    - memory
    - context_engine
    - web
    - image_gen
    - video_gen
  switched_off_modules:
    # The desktop serve's daemon shell: pid registry (psutil), sidecars, git stamp, socket lane.
    - hermes_cli.harness_parts.serve.daemon_shell
    - agent_runtime.serve_registry
    - agent_runtime.serve_socket
    - agent_runtime.parent_watch
