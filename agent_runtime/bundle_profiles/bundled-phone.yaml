    # Cron.
    - tools.cronjob_tools
    - tools.cronjob_job_args
    - tools.cronjob_prompt_scan
    - agent.monitoring.cron_health
    - cron
    # Local LLM and the speech service (OS speech and the OS model on phones).
    - hermes_cli.local_runtime
