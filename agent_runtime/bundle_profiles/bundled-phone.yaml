    - tools.subagent_worktree
    # The MCP client runtime (mcp.client false): no server is discovered, connected or run. Kept:
    # tools.mcp_tool_agent (the per-turn tool snapshot) and the common / schema / config helpers
    # that carry the switches and the tool-name prefix.
    - tools.mcp_tool
    - tools.mcp_tool_content
    - tools.mcp_tool_discovery
    - tools.mcp_tool_errors
    - tools.mcp_tool_handlers
    - tools.mcp_tool_health
