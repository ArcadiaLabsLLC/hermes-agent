name: Fork gates

# Fork-only gates that used to be jobs inside upstream's tests.yml. Keeping them
# in their own workflow means the fork does not edit upstream's workflow for
# them (docs/agent-runtime-harness/planned/disposition-misc-2026-09-24.md §5).
# tests.yml is `workflow_call`-only (ci.yaml orchestrates it), so this file
# carries the triggers the job used to inherit from ci.yaml.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: fork-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-claims:
    name: Changed-line mutation claims
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code and base history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Select changed claims before installing dependencies
        id: select
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          else
            BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          OUTPUT=$(python scripts/changed_line_mutation_check.py --base "$BASE" --list)
          printf '%s\n' "$OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          if printf '%s\n' "$OUTPUT" | grep -q '^mutation candidates: 0 '; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            # A zero has two completely different meanings and this job skipped
            # identically for both: "the diff touched no production source" and
            # "it touched seven and nobody registered a claim for any of them".
            # S5 landed in the second state and read exactly like the first.
            # The selector now names the changed sources no claim anchors in;
            # this annotation puts that on the run page instead of leaving it
            # inside a step log nobody opens on a green skip.
            #
            # A WARNING, never a failure. Whether a particular changed file MUST
            # carry a claim is unruled and has no honest default, so this only
            # refuses to let the two zeros look alike.
            UNREGISTERED=$(printf '%s\n' "$OUTPUT" | grep -c '^  NO CLAIM ANCHORS HERE: ' || true)
            if [ "${UNREGISTERED:-0}" -gt 0 ]; then
              echo "::warning title=Mutation gate had nothing to run::this diff changed ${UNREGISTERED} production source file(s) that carry no registered mutation claim — the skip is 'nobody registered', not 'nothing needed'"
            fi
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.select.outputs.run == 'true'
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install focused-test environment
        if: steps.select.outputs.run == 'true'
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra dev

      # The bound is WALL CLOCK (ruled 2026-09-04, replacing `--max-candidates`).
      # It is passed here rather than left to the script's default for the same
      # reason the cap was: the number a run actually enforces should be readable
      # beside the command that enforces it.
      #
      # 600 because this job's own `timeout-minutes: 15` is the real ceiling and
      # a checkout plus `uv sync` eats into it — a budget that expires INSIDE the
      # gate stops with a report naming what ran and what remains, where the job
      # timeout kills the step and says nothing. Raise it the same way, with the
      # reason written here, rather than dropping claims to fit.
      #
      # What the cap kept getting wrong, and why the count stopped being the
      # bound: it was always a proxy for runtime (one baseline plus one mutant
      # test run per candidate), and the proxy drifted. Symbol-overlap selection
      # raises the count BY DESIGN — measured on W1-H3's own diffs at 6 -> 27,
      # 32 -> 64 and 98 -> 104 against a cap of 20 — and a push-shaped base
      # collapses it, because on a push the base is `HEAD~1` and a two-commit
      # branch selects 2 and 2. Neither moves how long this step takes. The
      # count is still printed on every run; it is simply never asserted.
      - name: Require every selected mutant to turn its claimed test red
        if: steps.select.outputs.run == 'true'
        run: >-
          uv run python scripts/changed_line_mutation_check.py
          --base "${{ steps.select.outputs.base }}"
          --wall-budget-seconds 600

  # The two history-reading gates used to run inside upstream's tests.yml on a
  # fork-patched `fetch-depth: 0` checkout. That file is byte-identical to
  # upstream again and upstream's ci.yaml is disabled on the fork (owner,
  # 2026-09-26), so they run here, on full history, and nowhere else.
  history-gates:
    name: History-reading gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code and full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install test environment
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --group dev

      - name: Tombstone registry and docket stage claims
        run: >-
          uv run python -m pytest -q -p no:cacheprovider
          tests/agent_runtime/test_tombstone_registry.py
          tests/test_docket_stage_claims.py
