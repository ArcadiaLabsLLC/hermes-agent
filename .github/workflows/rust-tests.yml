# .github/workflows/rust-tests.yml
name: Rust tests

# `cargo test` for the Tauri bootstrap installer (Hermes-Setup) and for the
# fork's library crate crates/project_files_match (job `project-files-match`,
# below). Nothing in CI
# compiled this crate before: `.rs` lives under `apps/`, so the change
# classifier matched it as `frontend` and ran the TypeScript matrix, which
# cannot notice a Rust error. The crate's unit tests existed in the tree and had
# never run.
#
# Linux runner on purpose. The pipe-drain tests in src/powershell.rs need a real
# process tree whose grandchild inherits the parent's stdout, and their fixture
# is `#[cfg(unix)]`; the Windows half of that same contract is covered by
# `-SelfTestPipeDrain` in scripts/desktop-update/windows.ps1 on the Windows
# lane. A Windows runner here would compile them out and report green over zero
# coverage.

on:
  workflow_call:
    inputs:
      commit:
        description: Commit to test and build. Empty keeps the triggering commit.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: rust-tests-${{ (github.ref_type == 'tag' || inputs.commit != '') && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && inputs.commit == '' }}

jobs:
  bootstrap-installer:
    name: cargo test (bootstrap installer)
    # cargo builds codegen units and test binaries in parallel across the
    # cores. This lane also builds the crate from the start when Cargo.toml
    # changes.
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/bootstrap-installer/src-tauri
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          ref: ${{ inputs.commit }}

      # Tauri links against the system webkit2gtk on Linux, so the crate does
      # not compile without these even for `cargo test --lib`.
      - name: Install Tauri system dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      # Keyed on Cargo.toml, not Cargo.lock: apps/bootstrap-installer/.gitignore
      # excludes the lockfile (a create-tauri-app scaffold default), so there is
      # nothing pinned to hash and `--locked` cannot be used. That also means
      # this crate re-resolves its whole dependency graph on every build, which
      # is a real gap for a signed installer given the pinning policy in
      # AGENTS.md — tracking separately rather than widening this PR.
      #
      # No restore-keys: a partial hit leaves a stale target dir, and cargo
      # re-resolves correctly on top of a Cargo.toml-keyed hit anyway.
      - name: Restore cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/bootstrap-installer/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/bootstrap-installer/src-tauri/Cargo.toml') }}

      # --lib only: the integration/bin targets would need a built frontend
      # (vite dist) that this lane deliberately does not produce.
      - name: cargo test
        run: cargo test --lib

  # ripgrep's matcher for a phone's regex search_files (row
  # RT-PHONE-REGEX-SEARCH-RUNS-RIPGREPS-MATCHER-FROM-A-NATIVE-LIBRARY): the crate's
  # own tests, then a host release build, then the ctypes binding's tests against
  # that build. In the ordinary Python suite ETERNIA_PROJECT_FILES_MATCH_LIB is
  # unset and the native tests skip with that reason; here they run.
  # rust-toolchain.toml pins the toolchain; rustup installs it (and the five
  # targets it names) on the first cargo call. No wheel is built here.
  project-files-match:
    name: cargo test + binding tests (project_files_match)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crates/project_files_match
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          ref: ${{ inputs.commit }}

      - name: Restore cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/project_files_match/target
          key: cargo-pfm-${{ runner.os }}-${{ hashFiles('crates/project_files_match/Cargo.lock', 'crates/project_files_match/rust-toolchain.toml') }}

      - name: cargo test
        run: cargo test --locked

      - name: cargo build --release (the host library)
        run: cargo build --release --locked

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install the test environment
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.14 --group dev

      - name: Binding tests against the host build
        working-directory: .
        env:
          ETERNIA_PROJECT_FILES_MATCH_LIB: ${{ github.workspace }}/crates/project_files_match/target/release/libproject_files_match.so
        run: >-
          scripts/run_tests.sh -rs
          tests/agent_runtime/test_project_files_native_match.py
          tests/agent_runtime/test_agent_files.py
          tests/agent_runtime/test_phone_file_tools.py
